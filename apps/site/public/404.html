/* Shared by every page on qalm.apollolearn.app: tokens, base, buttons, header and footer. */
/* ---------- Apollo Study Space tokens (docs/brand.md) ---------- */
:root{
  --bg:#f6f6f8; --canvas:#f3f3f5; --surface:#fff; --surface-2:#f6f6f8; --soft:#e9e9ed;
  --ink:#27272a; --ink-2:#3f3f46; --muted:#5c5c65; --faint:#8b8b95;
  --line:#d3d3d9; --line-2:#e4e4e8;
  --accent:#4338ca; --accent-hover:#3730a3; --accent-ink:#3730a3; --accent-soft:#eeedfa; --accent-line:#c7c3ee; --on-accent:#fff;
  --assistant:#1d4ed8; --assistant-soft:#ebf0fc; --assistant-line:#bfcdf4;
  --context:#0f766e; --context-soft:#e4f1ef; --good:#047857; --good-soft:#e6f2ee; --warn:#9a4a08; --warn-soft:#f5ede6;
  --bad:#b91c1c; --bad-soft:#f8e9e9;
  --shadow-1:0 1px 2px rgba(0,0,0,.04);
  --shadow-2:0 18px 40px -16px rgba(0,0,0,.22),0 0 0 1px rgba(0,0,0,.04);
  --paper-shadow:0 1px 2px rgba(0,0,0,.05),0 24px 48px -28px rgba(24,24,40,.28);
  --r8:8px; --r12:12px;
  --sans:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
  --gutter:clamp(16px,4vw,40px);
  --max:1200px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#151517; --canvas:#151517; --surface:#1c1c1f; --surface-2:#212125; --soft:#2a2a2f;
    --ink:#f4f4f5; --ink-2:#d4d4d8; --muted:#a1a1aa; --faint:#8b8b95;
    --line:#303035; --line-2:#28282d;
    --accent:#5b50f0; --accent-hover:#6d63f4; --accent-ink:#a9a3ff; --accent-soft:#26244a; --accent-line:#403b86; --on-accent:#fff;
    --assistant:#60a5fa; --assistant-soft:#1d2a3d; --assistant-line:#2f4b72;
    --context:#5eccc4; --context-soft:#17302e; --good:#34d399; --good-soft:#1a2e27; --warn:#fbbf24; --warn-soft:#332a17;
    --bad:#f87171; --bad-soft:#351f20;
    --shadow-1:0 1px 2px rgba(0,0,0,.3);
    --shadow-2:0 18px 40px -16px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.04);
    --paper-shadow:0 1px 2px rgba(0,0,0,.4),0 28px 56px -30px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--sans);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:hidden}
img,svg{display:block;max-width:100%}
a{color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--accent-line);outline-offset:2px;box-shadow:0 0 0 1px var(--accent)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:12px;top:-60px;z-index:10;background:var(--surface);border:1px solid var(--line);border-radius:var(--r8);padding:10px 14px;text-decoration:none;font-weight:600}
.skip:focus{top:12px}
.wrap{max-width:calc(var(--max) + var(--gutter)*2);margin:0 auto;padding:0 var(--gutter)}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:0}
.muted{color:var(--muted)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:48px;padding:0 20px;border-radius:var(--r8);border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 15px/1 var(--sans);text-decoration:none;white-space:nowrap;transition:background-color .15s,border-color .15s,color .15s}
.btn:hover{border-color:var(--ink-2)}
.btn svg{width:18px;height:18px;flex:none}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-sm{height:40px;padding:0 14px;font-size:14px}
.btn .arrow{transition:transform .15s}
.btn:hover .arrow{transform:translateX(2px)}

/* ---------- header ---------- */
.site-head{padding:20px 0}
.site-head .wrap{display:flex;align-items:center;gap:24px}
.lockup{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.lockup svg{width:42px;height:35px}
.lockup .name{display:flex;flex-direction:column;line-height:1}
.lockup b{font-size:22px;font-weight:600;letter-spacing:-.02em}
.lockup small{font-size:12.8px;font-weight:500;color:var(--muted);margin-top:3px}
.mark .nib{stroke:var(--ink)} .mark .nibfill{fill:var(--ink)} .mark .orbit{stroke:var(--accent)} .mark .planet{fill:var(--assistant)}
.site-nav{display:flex;gap:4px;margin-left:auto}
.site-nav a{padding:10px 12px;border-radius:var(--r8);text-decoration:none;color:var(--muted);font-size:15px;font-weight:500}
.site-nav a:hover{color:var(--ink);background:var(--soft)}
@media (max-width:860px){.site-nav{display:none}.site-head .btn{margin-left:auto}}

/* ---------- hand-drawn underline ---------- */
.underline{display:inline-block;position:relative;white-space:nowrap}
.underline svg{position:absolute;left:-2%;bottom:-.1em;width:104%;height:.24em;overflow:visible}
.underline path{fill:var(--accent)}

/* ---------- footer ---------- */
.site-foot{border-top:1px solid var(--line-2);padding:32px 0 40px}
.site-foot .wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.site-foot .lockup svg{width:32px;height:27px}
.site-foot .lockup b{font-size:17px}
.site-foot .lockup small{font-size:11px}
.site-foot nav{display:flex;gap:4px;margin-left:auto}
.site-foot nav a{font-size:14px;color:var(--muted);text-decoration:none;padding:10px 10px;border-radius:var(--r8)}
.site-foot nav a:hover{color:var(--ink);background:var(--soft)}
.site-foot .copy{font-size:13px;color:var(--muted);width:100%}

.site-foot nav{flex-wrap:wrap}
@media (max-width:640px){
  .site-foot nav{margin-left:-10px;width:calc(100% + 10px)}
}

/* ---------- reduced motion ---------- */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* ---------- pages ---------- */
.kicker{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;color:var(--muted)}
.doc-hero{border-bottom:1px solid var(--line-2);padding:clamp(28px,5vw,72px) 0 clamp(36px,5vw,64px)}
.doc-hero h1{font-size:clamp(40px,6vw,72px);line-height:1;letter-spacing:-.04em;font-weight:600;margin:16px 0 0;max-width:14em;text-wrap:balance}
.doc-hero .lead{font-size:clamp(17px,1.5vw,19px);color:var(--muted);line-height:1.6;margin-top:20px;max-width:38em}
.updated{display:inline-block;margin-top:26px;padding-bottom:4px;border-bottom:2px solid var(--accent);font-size:14px;font-weight:600}
.doc{display:grid;grid-template-columns:15rem minmax(0,1fr);gap:clamp(32px,6vw,72px);padding:clamp(36px,5vw,64px) 0 clamp(56px,7vw,96px)}
.toc{position:sticky;top:24px;align-self:start;border-top:1px solid var(--line)}
.toc a{display:flex;align-items:center;gap:12px;min-height:44px;padding:6px 0;border-bottom:1px solid var(--line-2);font-size:14px;color:var(--muted);text-decoration:none;line-height:1.35}
.toc a:hover{color:var(--accent-ink)}
.num{font-family:var(--mono);font-size:12px;color:var(--accent-ink);font-variant-numeric:tabular-nums;flex:none}
.sections{max-width:46rem;border-top:1px solid var(--line)}
.sec{display:grid;grid-template-columns:3rem minmax(0,1fr);gap:12px;padding:clamp(28px,3.5vw,40px) 0;border-bottom:1px solid var(--line-2);scroll-margin-top:24px}
.sec:first-child{padding-top:24px}
.sec .num{padding-top:9px}
.sec h2{font-size:clamp(22px,2.4vw,28px);line-height:1.2;letter-spacing:-.02em;font-weight:600}
.sec p{margin-top:14px;font-size:16.5px;line-height:1.75;color:var(--muted)}
.sec ul{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:12px}
.sec li{display:flex;gap:12px;font-size:16.5px;line-height:1.75;color:var(--muted)}
.sec li::before{content:"";width:6px;height:6px;margin-top:.8em;background:var(--accent);flex:none}
.prose a,.contact-band a{color:var(--accent-ink);font-weight:500;text-decoration:underline;text-underline-offset:3px}
.contact-band{border-top:1px solid var(--line-2);background:var(--surface);padding:clamp(36px,5vw,64px) 0}
.contact-band h2{font-size:clamp(24px,2.6vw,30px);letter-spacing:-.02em;font-weight:600}
.contact-band p{margin-top:12px;font-size:16px;line-height:1.7;color:var(--muted);max-width:46em}
@media (max-width:900px){
  .doc{grid-template-columns:1fr}
  .toc{position:static}
}
@media (max-width:640px){
  .sec{grid-template-columns:1fr;gap:4px}
  .sec .num{padding-top:0}
}

/* contact */
.ways{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;padding:clamp(36px,5vw,64px) 0}
.way{padding:clamp(22px,3vw,32px);display:flex;flex-direction:column;gap:10px}
.way .ic{width:44px;height:44px;border-radius:var(--r12);display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink);margin-bottom:6px}
.way .ic svg{width:22px;height:22px}
.way h2{font-size:22px;letter-spacing:-.02em;font-weight:600}
.way p{font-size:16px;color:var(--muted);line-height:1.6}
.way .btn{align-self:flex-start;margin-top:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r12);box-shadow:var(--shadow-1)}
.small-print{padding:0 0 clamp(56px,7vw,96px);font-size:15px;color:var(--muted);line-height:1.7;max-width:46em}
@media (max-width:760px){.ways{grid-template-columns:1fr}}

/* 404 and "not available yet" */
.note-page{padding:clamp(28px,6vw,88px) 0 clamp(64px,9vw,120px);display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(32px,6vw,80px);align-items:center}
.note-page h1{font-size:clamp(38px,5vw,64px);line-height:1.02;letter-spacing:-.04em;font-weight:600;text-wrap:balance}
.note-page p{margin-top:18px;font-size:clamp(17px,1.5vw,19px);color:var(--muted);line-height:1.6;max-width:30em}
.note-page .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}
.scrap{background:#fff;border-radius:6px;box-shadow:var(--shadow-2);transform:rotate(-1.5deg);max-width:440px;width:100%;justify-self:center}
.scrap svg{width:100%;height:auto;display:block}
.scrap .pen-ink{fill:#27272a}
@media (max-width:820px){.note-page{grid-template-columns:1fr}.scrap{order:-1;max-width:320px}}
@media (max-width:640px){.note-page .actions .btn{flex:1 1 100%}}
</style>
