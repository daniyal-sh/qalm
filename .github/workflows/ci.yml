name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The desktop unit tests only compile TypeScript; they don't need Electron's binary.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      # Installs the pnpm version from package.json's "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test core
        run: pnpm --filter @qalm/core test
      - name: Test app
        run: pnpm --filter @qalm/app test
      - name: Test server
        run: pnpm --filter @qalm/server test
      - name: Test site
        run: pnpm --filter @qalm/site test
      - name: Test desktop
        run: pnpm --filter @qalm/desktop test
