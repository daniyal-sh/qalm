<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>qalm logo options</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --acc: #4338ca; --ast: #1d4ed8;
    --ink: var(--foreground, #27272a); --bgc: var(--card, #fff);
    --line: var(--border, #d3d3d9); --mut: var(--muted-foreground, #5c5c65);
  }
  @media (prefers-color-scheme: dark) { :root { --acc: #6d63f5; --ast: #60a5fa; } }
  body { font-family: Figtree, var(--font-sans, system-ui), sans-serif; margin: 0; }
  .intro { color: var(--mut); font-size: 14px; margin: 0 0 16px; line-height: 1.5; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
  .card { border: 1px solid var(--line); border-radius: 12px; background: var(--bgc); padding: 16px; }
  .head { display: flex; align-items: baseline; gap: 8px; }
  .tag { font: 600 12px/1 'Geist Mono', ui-monospace, monospace; color: var(--acc); }
  .name { font-weight: 600; font-size: 16px; letter-spacing: -0.01em; }
  .why { color: var(--mut); font-size: 13px; line-height: 1.45; margin: 6px 0 12px; min-height: 38px; }
  .hero { display: grid; place-items: center; height: 150px; border-radius: 10px; border: 1px solid var(--line); }
  .hero svg { width: 118px; height: 118px; }
  .row { display: flex; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .tile { width: 52px; height: 52px; border-radius: 12px; display: grid; place-items: center; }
  .tile svg { width: 36px; height: 36px; }
  .t-light { background: #fff; border: 1px solid #e4e4e8; --ink: #27272a; --bgc: #fff; --acc: #4338ca; --ast: #1d4ed8; }
  .t-indigo { background: #4338ca; --ink: #fff; --bgc: #4338ca; --acc: #c9c5ff; --ast: #93c5fd; }
  .t-dark { background: #1c1c1f; --ink: #f4f4f5; --bgc: #1c1c1f; --acc: #7b72ff; --ast: #60a5fa; }
  .fav { display: flex; align-items: end; gap: 8px; margin-left: auto; color: var(--mut); font-size: 11px; }
  .fav svg { display: block; }
  .lockup { display: flex; align-items: center; gap: 10px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
  .lockup svg { width: 40px; height: 40px; }
  .wm { line-height: 1; }
  .wm b { display: block; font-weight: 600; font-size: 22px; letter-spacing: -0.02em; }
  .wm span { display: block; font-weight: 500; font-size: 12.5px; color: var(--mut); margin-top: 3px; }
  /* The q's bowl matches the x-height of "alm"; its nib hangs below the baseline as a descender. */
  .wordmark { display: inline-block; font-weight: 600; font-size: 54px; letter-spacing: -0.035em; line-height: 1; white-space: nowrap; }
  .wordmark svg { width: 34.4px; height: 47px; vertical-align: -18.6px; margin-right: 1px; }
  .wordmark.sm { font-size: 24px; }
  .wordmark.sm svg { width: 15.3px; height: 21px; vertical-align: -8.3px; margin-right: 0.5px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <clipPath id="frontA" clipPathUnits="userSpaceOnUse"><rect x="0" y="52" width="100" height="60"/></clipPath>
    <clipPath id="frontF" clipPathUnits="userSpaceOnUse"><rect x="0" y="50" width="100" height="60"/></clipPath>

    <!-- A: refined nib in orbit (today's idea, cleaner) -->
    <symbol id="mA" viewBox="0 0 100 100">
      <g transform="rotate(-20 50 52)"><ellipse cx="50" cy="52" rx="45" ry="15" fill="none" style="stroke:var(--acc)" stroke-width="5"/></g>
      <path d="M50 90 C44 76 33 65 33 51 C33 39 40 28 50 14 C60 28 67 39 67 51 C67 65 56 76 50 90Z" style="fill:var(--bgc);stroke:var(--ink)" stroke-width="6" stroke-linejoin="round"/>
      <line x1="50" y1="82" x2="50" y2="58" style="stroke:var(--ink)" stroke-width="4.5" stroke-linecap="round"/>
      <circle cx="50" cy="51" r="4.2" style="fill:var(--ink)"/>
      <g transform="rotate(-20 50 52)">
        <ellipse cx="50" cy="52" rx="45" ry="15" fill="none" style="stroke:var(--acc)" stroke-width="5" clip-path="url(#frontF)"/>
        <circle cx="86.9" cy="60.6" r="6.2" style="fill:var(--ast);stroke:var(--bgc)" stroke-width="3"/>
      </g>
    </symbol>

    <!-- B: brush-stroke q with an ink drop -->
    <symbol id="mB" viewBox="0 0 100 100">
      <path fill-rule="evenodd" style="fill:var(--ink)" d="M16 47 a26 27 0 1 0 52 0 a26 27 0 1 0 -52 0Z M31 45 a16 19.5 0 1 0 32 0 a16 19.5 0 1 0 -32 0Z"/>
      <path style="fill:var(--ink)" d="M61 23 C65 21.5 70 20.5 75 19.5 L73 77 C73 87 68.5 93 59 96.5 C63.5 89.5 64.5 84 64.5 77 Z"/>
      <circle cx="83" cy="88" r="6" style="fill:var(--acc)"/>
    </symbol>

    <!-- C: solid nib with Apollo's planet -->
    <symbol id="mC" viewBox="0 0 100 100">
      <path d="M46 92 C39 77 27 66 27 50 C27 37 35 25 46 10 C57 25 65 37 65 50 C65 66 53 77 46 92Z" style="fill:var(--acc)"/>
      <line x1="46" y1="84" x2="46" y2="57" style="stroke:var(--bgc)" stroke-width="4" stroke-linecap="round"/>
      <circle cx="46" cy="49" r="5.2" style="fill:var(--bgc)"/>
      <circle cx="78" cy="22" r="9" style="fill:var(--ast)"/>
    </symbol>

    <!-- D: the orbit, written by hand (thick-thin pen stroke) around the planet -->
    <symbol id="mD" viewBox="0 0 100 100">
      <g transform="rotate(-24 50 50)">
        <path fill-rule="evenodd" style="fill:var(--ink)" d="M5 51 a45 24 0 1 0 90 0 a45 24 0 1 0 -90 0Z M12 48 a39 17.5 0 1 0 78 0 a39 17.5 0 1 0 -78 0Z"/>
      </g>
      <circle cx="50" cy="50" r="12.5" style="fill:var(--acc)"/>
    </symbol>

    <!-- E: a q whose tail is a nib -->
    <symbol id="mE" viewBox="0 0 100 100">
      <circle cx="41" cy="41" r="21" fill="none" style="stroke:var(--ink)" stroke-width="8.5"/>
      <rect x="61.5" y="16.5" width="9" height="48" rx="1.5" style="fill:var(--ink)"/>
      <path d="M55.5 62 L76.5 62 C76.5 76 70.5 86.5 66 99 C61.5 86.5 55.5 76 55.5 62Z" style="fill:var(--acc)"/>
      <line x1="66" y1="76" x2="66" y2="93" style="stroke:var(--bgc)" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="66" cy="72" r="3.2" style="fill:var(--bgc)"/>
    </symbol>
  </defs>
</svg>

<p class="intro">Six directions for the new qalm mark. Each shows the mark on its own, as an app icon (light, indigo, graphite), at favicon size, and in the “qalm by Apollo” lockup. Colours follow the brand: graphite ink, indigo accent, assistant blue for Apollo’s planet.</p>

<div class="grid" id="grid"></div>

<script>
  const options = [
    { id: 'A', name: 'Nib in orbit, refined', why: 'Today’s idea, redrawn: a cleaner nib, a thinner orbit passing behind and in front, and the planet riding the ring.' },
    { id: 'B', name: 'Brush q', why: 'A thick-and-thin pen-stroke “q”, like one written with a real nib, with an ink drop for a full stop. The most “handwriting”.' },
    { id: 'C', name: 'Solid nib + planet', why: 'A bold, simple nib in indigo with Apollo’s blue planet beside it. Reads best at tiny sizes.' },
    { id: 'D', name: 'Written orbit', why: 'Apollo’s orbit drawn as a single pen stroke, thick and thin, around the planet. The family link, in ink.' },
    { id: 'E', name: 'Nib q', why: 'A geometric “q” whose tail is a pen nib. The letter and the pen in one shape; doubles as the wordmark’s first letter.' },
    { id: 'F', name: 'Nib q wordmark', why: 'Option E built into the word itself: “qalm” where the q’s tail is the nib. For the site header and splash.', wordmark: true },
  ];
  const use = (id, size, extra = '') => `<svg viewBox="0 0 100 100" ${size ? `width="${size}" height="${size}"` : ''} ${extra} aria-hidden="true"><use href="#m${id}"/></svg>`;
  // The q cropped to its ink (bowl x 15.75-70.5, top 15.75, nib tip 99), so it sits in the word like a letter.
  const q = `<svg viewBox="15 15 62 85" aria-hidden="true"><use href="#mE" x="0" y="0" width="100" height="100"/></svg>`;
  document.getElementById('grid').innerHTML = options.map(o => {
    const m = o.wordmark ? 'E' : o.id;
    const hero = o.wordmark ? `<div class="wordmark">${q}alm</div>` : use(m);
    const lockup = o.wordmark
      ? `<div class="wordmark sm">${q}alm</div><div class="wm"><span style="margin:0 0 0 6px">by Apollo</span></div>`
      : `${use(m)}<div class="wm"><b>qalm</b><span>by Apollo</span></div>`;
    return `<section class="card">
      <div class="head"><span class="tag">${o.id}</span><span class="name">${o.name}</span></div>
      <p class="why">${o.why}</p>
      <div class="hero">${hero}</div>
      <div class="row">
        <div class="tile t-light">${use(m)}</div>
        <div class="tile t-indigo">${use(m)}</div>
        <div class="tile t-dark">${use(m)}</div>
        <div class="fav"><div>${use(m, 32)}32</div><div>${use(m, 16)}16</div></div>
      </div>
      <div class="lockup">${lockup}</div>
    </section>`;
  }).join('');
</script>
</body>
</html>
